# CI de pruebas (F0, NFR-17). Las pruebas de red (#[ignore = "... network"]) NO corren acá:
# se corren en la sesión real del usuario (lección 7).
name: ci
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy -p streamonte-core --all-targets -- -D warnings
      - run: cargo test -p streamonte-core
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  shared-ui:
    # packages/ui: código compartido web + desktop. Usa el typescript de ui/node_modules (no tiene node_modules propio).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm check
        working-directory: packages/ui
      - run: pnpm test
        working-directory: packages/ui
  # Regresión visual (scripts/visual.mjs) fuera del CI (2026-11-22): fallaba en cada cambio de diseño y por el render del
  # runner. Se corre a mano antes de pushear un cambio visible: `node scripts/visual.mjs` (ver tests/visual/README.md).
