# CI de pruebas (F0, NFR-17). Las pruebas de red (#[ignore = "... network"]) NO corren acá:
# se corren en la sesión real del usuario (lección 7).
# scripts/ci-local.sh corre los `run:` de este archivo en la Mac (lee los jobs con un parser mínimo: mantener el formato
# `- run: <comando>` con `working-directory:` en el paso o en `defaults:`).
name: ci
# Solo branches (y PRs): un tag apunta a un commit que ya pasó por su branch, y repetirlo dejaba el job de macOS
# esperando máquina hasta cancelarse (v2.1.6, 2026-11-23). El build del tag lo hace release.yml.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  core:
    strategy:
      matrix:
        # Windows en cada push; macOS solo en PRs y a mano (el día a día en macOS lo cubre scripts/ci-local.sh).
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p streamonte-core --all-targets -- -D warnings
      - run: cargo test -p streamonte-core --lib --tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        working-directory: web
      - run: pnpm test
        working-directory: web
  ui:
    # ui/ y packages/ui (código compartido web + desktop). Un solo install en la raíz (workspace pnpm).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check
        working-directory: packages/ui
      - run: pnpm test
        working-directory: packages/ui
  # Regresión visual (scripts/visual.mjs) fuera del CI (2026-11-22): fallaba en cada cambio de diseño y por el render del
  # runner. Se corre a mano antes de pushear un cambio visible: `node scripts/visual.mjs` (ver tests/visual/README.md).
