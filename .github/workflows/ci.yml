# CI de pruebas (F0, NFR-17). Las pruebas de red (#[ignore = "... network"]) NO corren acá:
# se corren en la sesión real del usuario (lección 7).
name: ci
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy -p streamonte-core --all-targets -- -D warnings
      - run: cargo test -p streamonte-core
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
  shared-ui:
    # packages/ui: código compartido web + desktop. Usa el typescript de ui/node_modules (no tiene node_modules propio).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: packages/ui
      - run: npm test
        working-directory: packages/ui
  visual:
    # Regresión visual (scripts/visual.mjs). macOS: las baselines se graban en el Mac del dev y acá el render de
    # fuentes es el mismo; en Linux las fuentes del sistema son otras y todo diferiría. Chrome ya viene en el runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: web
      - run: node scripts/visual.mjs --out visual-diffs
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: visual-diffs, path: visual-diffs }
