# Push a tag like v0.2.0 (same version as src-tauri/tauri.conf.json): a draft release is created,
# Mac and Windows build in parallel and upload to it, then the last job writes latest.json
# (which installed apps check at launch) and publishes the release. Same mechanism as monti-git.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Mac: the universal .dmg (Apple Silicon and Intel). The first time macOS blocks it (not notarized): System Settings → Privacy & Security → "Open Anyway".
            Windows: the -setup.exe. If SmartScreen warns, "More info" → "Run anyway".
            Mac: pick the .dmg for your chip (aarch64 = Apple Silicon, x64 = Intel).
            mpv is included (macOS 15 or newer, and Windows). On older macOS, install mpv (Settings → Player → Install mpv) or use VLC if you have it.
        # The id comes from the create response: a draft isn't findable by its tag until it's published.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Streamonte $GITHUB_REF_NAME" \
            -F draft=true -f body="$NOTES" --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg per chip (2026-11-17): each bundles its own mpv (~50 MB), a universal one would carry both.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            mpv: macos-arm
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            mpv: macos-intel
          - platform: windows-latest
            args: ""
            target: ""
            mpv: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      # No frontend build (ui/ is embedded as-is); node is only for the Tauri CLI that tauri-action installs.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target" # cargo workspace at the repo root
      # Official mpv for this platform into src-tauri/mpv (bundle.resources), checksum-pinned.
      - run: sh scripts/fetch-mpv.sh ${{ matrix.mpv }}
        shell: bash
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          uploadUpdaterJson: false # written once by the publish job, so parallel builds don't race
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Everything by release id (the release is still a draft): fetch the signatures, upload latest.json, then publish.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.create-release.outputs.id }}
        run: |
          mkdir sigs
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r asset name; do gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "sigs/$name"; done
          node .github/scripts/latest-json.mjs > latest.json
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=latest.json" > /dev/null
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true > /dev/null
