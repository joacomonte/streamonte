# Workspace de Streamonte.
# - crates/core : núcleo (orquestación) SIN dependencia de Tauri → testeable solo (NFR-01, NFR-17).
# - src-tauri   : cáscara de la app (ventana, comandos, eventos). Solo traduce UI <-> core.
[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs", "io-util"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "5"
which = "6"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"

[profile.release]
# NFR-14: app liviana.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
