<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamonte</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <!-- FR-29: barra superior con acción primaria destacada -->
  <header class="topbar">
    <h1 class="brand"><img src="../packages/ui/src/assets/logo-mark.svg" alt="Streamonte" width="22" height="25" /></h1>
    <div class="actions">
      <!-- Magnet copiado: ui/src/components/CopiedMagnet.svelte (lo monta src/main.ts acá). -->
      <span id="top-copied-host" class="host"></span>
      <!-- Velocidad de internet (2026-11-16, ui/src/speed.js): tocar = medir de nuevo. -->
      <button id="btn-speed" class="top-btn speed" title="Velocidad de internet"></button>
      <!-- Bajando de fondo, botón y menú Descargas, barra de progreso: ui/src/components/Downloads.svelte. -->
      <span id="top-downloads-host" class="host"></span>
      <button id="btn-settings" class="top-btn bare" title="Ajustes" aria-label="Ajustes"></button>
    </div>
  </header>

  <main class="layout">
    <!-- F4b: catálogo (ui/src/catalog.js) -->
    <section id="catalog" class="catalog" aria-label="Buscar"></section>

    <!-- FR-14: el panel de reproducciones se quitó (2026-11-14): el estado y Detener van en la
         fila; carpeta, borrar y log en su menú contextual. -->
  </main>

  <!-- Ajustes, log y confirmaciones: ui/src/components/ (Svelte, montados por main.ts). -->

  <!-- FR-29: barra de estado con progreso -->
  <footer class="statusbar">
    <span id="status">Listo</span>
    <progress id="progress" max="1" value="0" hidden></progress>
  </footer>
</body>
</html>
