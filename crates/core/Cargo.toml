[package]
name = "streamonte-core"
description = "Núcleo de Streamonte: biblioteca, análisis, reproducción, limpieza, subtítulos. Sin Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
which.workspace = true
chrono.workspace = true
data-encoding.workspace = true
# Sin regex: los patrones de F2 (SxxExx) se resuelven a mano (NFR-14).

# Motor rqbit embebido (ADR-15). Opcional: si el benchmark de F1 elige webtorrent, se puede apagar
# y la app queda más liviana (NFR-14).
librqbit = { version = "9.1", optional = true, default-features = false, features = ["default-tls"] }
anyhow = { version = "1", optional = true }
# Ya lo trae librqbit (no suma peso): contar peers del DHT mientras se esperan metadatos.
futures-util = { version = "0.3", optional = true, default-features = false }

# Subtítulos (FR-22–28): HTTP a proveedores (misma versión que ya trae librqbit → no suma peso),
# decodificar subtítulos viejos en Latin-1/Windows-1252, y API keys en el almacén seguro del SO (NFR-16).
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "form", "query"] }
encoding_rs = "0.8"
# OpenSubtitles.org entrega base64 de un gzip (ya venían en el árbol por rqbit/reqwest).
base64 = "0.23"
flate2 = "1.1"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Limpieza (FR-16/20, T-05): saber si el dueño de una carpeta sigue vivo (con hora de inicio, por PIDs reciclados).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# Portapapeles (FR-01/02): oyente Win32 + historial Win+V (WinRT). Misma versión que usa Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

# Portapapeles en macOS (FR-01): sondeo de NSPasteboard.changeCount (R-06).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[features]
default = ["rqbit"]
rqbit = ["dep:librqbit", "dep:anyhow", "dep:futures-util"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "signal"] }
