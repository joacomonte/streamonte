<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtros — frase resumen</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1014; --surface: #161a20; --surface-2: #1c2129; --surface-3: #232a34; --sunk: #11151a;
  --text: #e7eaee; --muted: #9aa3ae; --dim: #8b949f; --border: #252b34; --border-strong: #353d48; --track: #46505d;
  --accent: #2563eb; --accent-fg: #7ab0ff; --shadow-lg: rgb(0 0 0 / .45); --radius: 8px; --radius-card: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }
.note { color: var(--dim); font-size: 13px; margin: 0 0 28px; text-align: center; }

.sentence { text-align: center; font-size: 22px; color: var(--muted); line-height: 1.9; }
.dd { position: relative; display: inline-block; }
.word { border: none; background: none; padding: 0 2px; font-size: 22px; font-weight: 600; color: var(--text); border-bottom: 2px dashed var(--border-strong); }
.word:hover, .word.open { border-color: var(--accent); color: var(--accent-fg); }
.state { margin-top: 6px; text-align: center; font: 12px ui-monospace, monospace; color: var(--dim); }

.pop { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); z-index: 20; min-width: 240px; padding: 6px; font-size: 14px; line-height: 1.4; text-align: left; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 12px 32px var(--shadow-lg); }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; padding: 8px 10px; border: none; border-radius: 6px; background: none; text-align: left; white-space: nowrap; }
.opt:hover { background: var(--surface-3); }
.opt.sel { color: var(--accent-fg); font-weight: 600; }
.opt.sel::after { content: "✓"; }
.opt small { color: var(--dim); font-weight: 400; }
.sep { height: 1px; background: var(--border); margin: 6px 4px; }

/* Cuándo */
.when { width: 300px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; }
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.on { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.decades { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 4px; }
.between { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: var(--muted); }
.between select { height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 13px system-ui, sans-serif; }
.more { margin: 4px 10px 6px; border: none; background: none; padding: 0; color: var(--dim); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.more:hover { color: var(--muted); }
.exact { display: grid; gap: 8px; margin: 4px 6px 6px; padding: 10px 4px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.exact label { display: flex; justify-content: space-between; align-items: center; }
.exact input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 4px 6px; font: 13px system-ui, sans-serif; }
.hint { font-size: 12px; color: var(--dim); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; margin-top: 36px; }
.poster { aspect-ratio: 2/3; border-radius: var(--radius); border: 1px solid var(--border); }
.pname { margin-top: 6px; height: 10px; width: 70%; border-radius: 4px; background: var(--surface-3); }
</style>
</head>
<body>
<main>
  <p class="note">Variante 2 refinada · clic en cada palabra subrayada</p>
  <div class="sentence" id="sentence"></div>
  <div class="state" id="state"></div>
  <div id="grid"></div>
</main>

<script>
const NOW = 2026, MIN = 1950; // MIN: primer año elegible; "Antes" cubre MIN–1979
const KINDS = [['movie', 'películas'], ['series', 'series'], ['miniseries', 'miniseries'], ['documentary', 'documentales']];
const SORTS = [['popular', 'más populares en IMDb', 'cuántos lo votan'], ['rating', 'con mejor puntaje IMDb', 'nota promedio'], ['recent', 'más recientes', 'por fecha de estreno']];
const PRESETS = [['Cualquier año', null], ['Este año', [NOW, NOW]], ['Últimos 5 años', [NOW - 4, NOW]], ['Últimos 10 años', [NOW - 9, NOW]]];
const DECADES = [['2020s', [2020, NOW]], ['2010s', [2010, 2019]], ['2000s', [2000, 2009]], ['90s', [1990, 1999]], ['80s', [1980, 1989]], ['Antes', [MIN, 1979]]];
const YEARS = Array.from({ length: NOW - MIN + 1 }, (_, k) => NOW - k);

const S = { kind: 'movie', sort: 'popular', when: { type: 'any' }, open: null, exact: false };

// ---------- texto ----------
const kindWord = () => KINDS.find(k => k[0] === S.kind)[1];
const sortWord = () => SORTS.find(x => x[0] === S.sort)[1];
const fmt = d => d ? d.split('-').reverse().join('/') : '…';
function whenWords() { // [preposición, palabra]
  const w = S.when;
  if (w.type === 'month') return ['del', 'último mes'];
  if (w.type === 'dates') return ['del', `${fmt(w.from)} a ${w.to ? fmt(w.to) : 'hoy'}`];
  if (w.type !== 'years') return ['de', 'cualquier año'];
  const { from, to } = w;
  if (from === NOW && to === NOW) return ['de', 'este año'];
  if (from === to) return ['de', String(from)];
  if (from === MIN && to < NOW) return ['de', `antes de ${to + 1}`];
  if (to === NOW && [5, 10].includes(NOW - from + 1)) return ['de', `los últimos ${NOW - from + 1} años`];
  if (to === NOW) return ['de', `${from} a hoy`];
  if (from % 10 === 0 && to === from + 9) return ['de', `los ${from < 2000 ? String(from).slice(2) : from}s`];
  return ['de', `${from} a ${to}`];
}
const yearsOf = () => S.when.type === 'years' ? [S.when.from, S.when.to] : [MIN, NOW];

// ---------- acciones ----------
function set(fn) { fn(); render(); }
const toggle = name => set(() => { S.open = S.open === name ? null : name; if (name === 'when') S.exact = S.when.type === 'dates' || S.when.type === 'month'; });
const pickKind = k => set(() => { S.kind = k; S.open = null; });
const pickSort = k => set(() => { S.sort = k; S.open = null; });
const pickYears = r => set(() => { S.when = r ? { type: 'years', from: r[0], to: r[1] } : { type: 'any' }; S.exact = false; S.open = null; });
// rango a mano: no cierra el popover; si quedan invertidos, se ordenan
function setYear(which, v) {
  let [from, to] = yearsOf();
  if (which === 'from') from = +v; else to = +v;
  set(() => { S.when = { type: 'years', from: Math.min(from, to), to: Math.max(from, to) }; });
}
const pickMonth = () => set(() => { S.when = { type: 'month' }; });
const setDate = (key, v) => set(() => { S.when = { type: 'dates', from: '', to: '', ...(S.when.type === 'dates' ? S.when : {}), [key]: v }; });

const isRange = r => r ? S.when.type === 'years' && S.when.from === r[0] && S.when.to === r[1] : S.when.type === 'any';

// ---------- render ----------
const opt = (id, label, sel, onclick, sub) => `<button id="${id}" class="opt ${sel ? 'sel' : ''}" onclick="${onclick}"><span>${label}${sub ? ` <small>· ${sub}</small>` : ''}</span></button>`;

function whenPop() {
  const [from, to] = yearsOf(), w = S.when;
  const yearOpts = (sel, withToday) => (withToday ? [['hoy', NOW]] : []).concat(YEARS.map(y => [y, y]))
    .filter((o, k) => !(withToday && k === 1)) // "hoy" ya representa el año actual
    .map(([l, v]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="pop when" id="pop-when">
    ${PRESETS.map(([l, r], i) => opt(`preset-${i}`, l, isRange(r), `pickYears(${JSON.stringify(r)})`)).join('')}
    <div class="sep"></div>
    <div class="decades">${DECADES.map(([l, r], i) => `<button id="decade-${i}" class="chip ${isRange(r) ? 'on' : ''}" onclick="pickYears(${JSON.stringify(r)})">${l}</button>`).join('')}</div>
    <div class="sep"></div>
    <div class="between">Entre
      <select id="year-from" onchange="setYear('from',this.value)">${yearOpts(w.type === 'years' ? from : null, false)}<option value="" ${w.type === 'years' ? '' : 'selected'} hidden>año</option></select>
      y <select id="year-to" onchange="setYear('to',this.value)">${yearOpts(w.type === 'years' ? to : NOW, true)}</select></div>
    ${S.exact ? `<div class="exact" id="exact">
        <button id="month" class="chip ${w.type === 'month' ? 'on' : ''}" style="justify-self:start" onclick="pickMonth()">Último mes</button>
        <label>Desde <input type="date" id="date-from" value="${w.type === 'dates' ? w.from : ''}" onchange="setDate('from',this.value)"></label>
        <label>Hasta <input type="date" id="date-to" value="${w.type === 'dates' ? w.to : ''}" onchange="setDate('to',this.value)"></label>
        <span class="hint">“Hasta” vacío = hoy</span></div>`
      : `<button id="more" class="more" onclick="set(() => { S.exact = true; })">Fechas exactas…</button>`}
  </div>`;
}

function render() {
  const [prep, whenW] = whenWords();
  document.getElementById('sentence').innerHTML = `Mostrando
    <span class="dd"><button id="kind" class="word ${S.open === 'kind' ? 'open' : ''}" onclick="toggle('kind')">${kindWord()}</button>${S.open === 'kind'
      ? `<div class="pop" id="pop-kind">${KINDS.map(([k, l]) => opt(`kind-${k}`, l, S.kind === k, `pickKind('${k}')`)).join('')}</div>` : ''}</span>
    <span class="dd"><button id="sort" class="word ${S.open === 'sort' ? 'open' : ''}" onclick="toggle('sort')">${sortWord()}</button>${S.open === 'sort'
      ? `<div class="pop" id="pop-sort">${SORTS.map(([k, l, sub]) => opt(`sort-${k}`, l, S.sort === k, `pickSort('${k}')`, sub)).join('')}</div>` : ''}</span>
    <span id="when-prep">${prep}</span>
    <span class="dd"><button id="when" class="word ${S.open === 'when' ? 'open' : ''}" onclick="toggle('when')">${whenW}</button>${S.open === 'when' ? whenPop() : ''}</span>`;
  document.getElementById('state').textContent = stateLine();
  const base = { movie: 210, series: 290, miniseries: 330, documentary: 150 }[S.kind];
  document.getElementById('grid').innerHTML = `<div class="grid">${Array.from({ length: 6 }, (_, k) =>
    `<div><div class="poster" style="background:linear-gradient(160deg,hsl(${base + k * 18} 55% 38%),hsl(${base + k * 18 + 40} 45% 14%))"></div><div class="pname"></div></div>`).join('')}</div>`;
}
function stateLine() {
  const w = S.when;
  const when = w.type === 'years' ? `año ${w.from}–${w.to}` : w.type === 'month' ? 'últimos 30 días' : w.type === 'dates' ? `fechas ${w.from || '…'} → ${w.to || 'hoy'}` : 'sin filtro de fecha';
  return `→ tipo=${S.kind} · orden=${S.sort} · ${when}`;
}

render();
document.addEventListener('click', e => {
  if (e.target.isConnected && S.open && !e.target.closest('.dd')) set(() => { S.open = null; });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) set(() => { S.open = null; }); });
</script>
</body>
</html>
