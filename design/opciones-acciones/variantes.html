<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opciones · acciones</title>
<!-- Variantes de la fila de opción con acciones (2026-11-18). Tokens y clases copiados de ui/styles.css y ui/catalog.css. -->
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --surface-2: #eef1f4; --surface-3: #e3e7ec;
  --text: #1b1f24; --muted: #535c68; --dim: #5c6571; --border: #dde1e6; --border-strong: #c3c9d1; --track: #98a1ad;
  --accent: #2563eb; --accent-text: #fff; --accent-fg: #1d4ed8; --green: #12733a; --yellow: #8a5300; --red: #c01c1c;
  --shadow-lg: rgb(15 23 42 / .28); --ease: cubic-bezier(.2, .8, .2, 1); --out: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1014; --surface: #161a20; --surface-2: #1c2129; --surface-3: #232a34;
    --text: #e7eaee; --muted: #9aa3ae; --dim: #8b949f; --border: #252b34; --border-strong: #353d48; --track: #46505d;
    --accent-fg: #7ab0ff; --green: #4ade80; --yellow: #facc15; --red: #f87171; --shadow-lg: rgb(0 0 0 / .7);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.ico { display: inline-flex; flex: none; }

main { max-width: 1320px; margin: 0 auto; padding: 32px 20px 64px; }
h1 { margin: 0 0 4px; font-size: 20px; }
.lead { margin: 0 0 28px; color: var(--muted); max-width: 70ch; }
.variants { display: grid; gap: 40px; }
.frames { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; }
.frame { container-type: inline-size; flex: 1 1 560px; max-width: 660px; min-width: 0; }
.frame.phone { flex: 0 0 375px; max-width: 100%; }
.frame-label { display: block; margin: 0 0 6px 2px; color: var(--muted); font-size: 12px; font-weight: 700; }
.variant h2 { margin: 0; font-size: 16px; }
.variant h2 b { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 6px; background: var(--surface-3); font-size: 12px; }
.variant p { margin: 4px 0 12px; color: var(--muted); font-size: 13px; max-width: 64ch; }
.case { display: block; margin: 0 0 4px 4px; color: var(--dim); font-size: 11px; font-weight: 600; }

/* --- del CSS real --- */
.cat-group { border-radius: 16px; border: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 60%, var(--surface)); padding: 10px; }
.cat-options { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cat-opt { position: relative; display: grid; align-items: center; gap: 4px 14px; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr) auto;
  padding: 12px 12px 12px 18px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border); transition: border-color .15s var(--ease), background .15s var(--ease); }
.cat-opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); background: color-mix(in srgb, var(--accent) 5%, var(--bg)); }
.cat-opt.tb-idle .cat-size-cell { grid-column: 1 / 3; }
.cat-size-cell { display: grid; gap: 2px; min-width: 0; }
.cat-size-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cat-size { font-size: 17px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cat-tag { display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 5px; border-radius: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border-strong); cursor: help; }
.cat-tag.cat-hdr { color: var(--text); border-color: color-mix(in srgb, var(--text) 45%, transparent); }
.cat-tag.lat { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); }
.cat-tag.cat-torbox { border-color: color-mix(in srgb, var(--green) 55%, var(--border)); color: color-mix(in srgb, var(--green) 80%, var(--text)); }
.cat-quality { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.cat-quality-q { display: inline-flex; align-items: center; gap: 6px; }
.cat-stars { letter-spacing: 1px; font-size: 11px; line-height: 1; }
.cat-stars i { font-style: normal; color: var(--track); }
.cat-stars i.on { color: #e8c26a; }
.cat-mid { display: grid; gap: 4px; justify-items: start; align-content: center; min-width: 0; }
.cat-verdict { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 2px; margin-left: -2px; border-radius: 8px; color: var(--text); }
.cat-verdict strong { font-size: 15px; }
.hbars rect { fill: color-mix(in srgb, var(--muted) 35%, transparent); }
.good .hbars rect.on { fill: var(--green); }
.fair .hbars rect.on { fill: var(--yellow); }
.cat-people { display: inline-flex; gap: 4px; padding-left: 2px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-people b { color: var(--muted); font-weight: 600; }
.cat-opt-actions { grid-column: 3; display: flex; align-items: center; gap: 8px; }
.cat-bg-btn { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--muted); }
.cat-bg-btn:hover { color: var(--text); background: var(--border-strong); }
.cat-play { display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text); transition: transform .2s var(--out), box-shadow .2s; }
.cat-play:hover { transform: scale(1.06); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); }
.cat-play.torbox { background: var(--green); color: #0b1a10; }
.cat-play.torbox:hover { box-shadow: 0 0 0 6px color-mix(in srgb, var(--green) 22%, transparent); }
.spin { width: 11px; height: 11px; border: 1.6px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

/* Mobile (≤ 440 px): ▶ arriba a la derecha, salud y seeds en una línea debajo. */
@container (max-width: 440px) {
  .cat-group { padding: 8px; border-radius: 14px; }
  .cat-opt { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 12px 10px 12px 14px; }
  .cat-opt.tb-idle .cat-size-cell { grid-column: 1; }
  .cat-opt-actions { grid-column: 2; grid-row: 1; }
  .cat-mid { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: center; gap: 12px; }
  .cat-verdict { height: 24px; }
  .cat-verdict strong { font-size: 14px; }
  .v-a .acts { margin: 4px -10px 0 -14px; padding: 2px 10px 2px 14px; gap: 0 16px; }
  .v-a .act { min-height: 36px; }
  .v-b .pill .t { display: none; }
  .v-b .pills { display: flex; gap: 6px; }
  .v-b .pills .pill { height: 32px; }
  .v-b .pill { width: 32px; padding: 0; justify-content: center; }
  .v-d .menu { right: 8px; min-width: 0; width: calc(100% - 16px); }
}

/* Hoy (referencia) */
.act-today { display: inline-flex; align-items: center; gap: 4px; height: 17px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.act-today:hover { color: var(--text); border-color: var(--accent); }

/* Acción común a A–C: sentence case, sin borde, verbo primero. Distinta de un badge en caja, peso y forma. */
.act { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: var(--accent-fg); font-size: 12px; font-weight: 600; white-space: nowrap; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: text-decoration-color .15s var(--ease), color .15s var(--ease); }
.act:hover, .act:focus-visible { text-decoration-color: currentColor; }
.act.busy { color: var(--muted); cursor: default; text-decoration: none; }
.act .ico { opacity: .85; }

/* A — fila secundaria */
.v-a .cat-opt.has-acts { padding-bottom: 0; }
.v-a .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px -12px 0 -18px; padding: 8px 12px 9px 18px; border-top: 1px solid var(--border); }

/* B — junto al ▶ */
.v-b .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 9px; border-radius: 999px; border: 1px solid var(--border-strong); background: none; color: var(--text); font-size: 12px; font-weight: 600; white-space: nowrap; transition: border-color .15s var(--ease), background .15s var(--ease); }
.v-b .pill:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.v-b .pill.busy { color: var(--muted); border-style: dashed; cursor: default; background: none; }
.v-b .pill .ico { color: var(--muted); }
.v-b .pills { display: grid; gap: 4px; justify-items: end; }
.v-b .pills .pill { height: 26px; }

/* C — dato + verbo en línea */
.v-c .fact { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.v-c .fact + .act::before { content: "·"; margin-right: 4px; color: var(--dim); }
.v-c .cat-opt { grid-template-columns: minmax(130px, 230px) minmax(0, 1fr) auto; }
.v-c .pair { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* D — menú … */
.v-d .more { position: relative; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--muted); }
.v-d .more:hover, .v-d .more[aria-expanded="true"] { color: var(--text); background: var(--border-strong); }
.v-d .more .dot { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-fg); box-shadow: 0 0 0 2px var(--bg); }
.v-d .more.busy { color: var(--accent-fg); }
.v-d .menu { position: absolute; z-index: 5; right: 70px; top: calc(100% - 8px); min-width: 250px; padding: 5px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); box-shadow: 0 10px 28px var(--shadow-lg); }
.v-d .menu[hidden] { display: none; }
.v-d .menu button { display: grid; grid-template-columns: 18px 1fr; gap: 0 9px; width: 100%; padding: 7px 9px; border: 0; border-radius: 6px; background: none; color: var(--text); text-align: left; font-size: 13px; font-weight: 600; }
.v-d .menu button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.v-d .menu small { grid-column: 2; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.v-d .menu .ico { color: var(--muted); margin-top: 1px; }
.v-d .menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--border); }
.v-d .hint { color: var(--dim); font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Fila de opción: estado vs. acciones</h1>
  <p class="lead">Badges en mayúscula y en caja = dato. Acciones = verbo primero, minúscula, con ícono, nunca en caja chica. Las cinco filas de cada variante son los mismos casos. Pasá el mouse; en D, tocá el “…”.</p>
  <div class="variants" id="variants"></div>
</main>

<script>
const ICONS = {
  play: '<path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z" fill="currentColor" stroke="none"/>',
  speaker: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  subs: '<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/>',
  download: '<path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/>',
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  more: '<circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/>',
};
const ic = (n, s = 13) => `<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg></span>`;
const stars = (n) => `<span class="cat-stars" role="img" aria-label="${n} de 4">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? 'on' : ''}">★</i>`).join('')}</span>`;
const bars = (n) => `<svg class="hbars" width="16" height="14" viewBox="0 0 16 14">${[0, 1, 2].map((i) => `<rect class="${i < n ? 'on' : ''}" x="${i * 6}" y="${10 - i * 4}" width="4" height="${4 + i * 4}" rx="1"/>`).join('')}</svg>`;

// Los cinco casos. acts: lo que hoy son etiquetas grises clickeables.
const CASES = [
  { label: 'TorBox con sub ES', id: 'tb1', size: '31,4 GB', torbox: true, subEs: true, q: ['Máster', 4], lat: true, acts: [] },
  { label: 'TorBox sin sub ES', id: 'tb2', size: '18,2 GB', torbox: true, hdr: true, q: ['Blu-ray', 3], acts: ['subs'] },
  { label: 'Torrent · ¿trae latino?', id: 't1', size: '12,6 GB', q: ['WEB-DL', 3], health: ['good', 3, 'Fluida'], seeds: [42, 8], acts: ['latread'] },
  { label: 'Torrent · audio ES sin variante', id: 't2', size: '9,8 GB', q: ['Blu-ray', 3], health: ['fair', 2, 'Aceptable'], seeds: [11, 3], acts: ['latcheck', 'subs'] },
  { label: 'Torrent · leyendo audios', id: 't3', size: '6,1 GB', q: ['WEB-DL', 3], health: ['good', 3, 'Fluida'], seeds: [27, 5], acts: ['reading'] },
];
// Texto de cada acción (largo para A–C, corto + explicación para el menú de D).
const ACT = {
  subs: { ic: 'search', text: 'Buscar subs en español', short: 'Buscar subs ES', today: 'Buscar subs ES', why: 'No trae: los busca afuera' },
  latread: { ic: 'speaker', text: 'Revisar si trae latino', short: 'Revisar latino', today: '¿Trae latino? Revisar', why: 'Dice MULTI: lee sus audios (unos segundos)' },
  latcheck: { ic: 'speaker', text: 'Ver pistas de audio', short: 'Ver pistas', today: 'Audio ES · validar latino', why: 'Español sin aclarar si latino o España' },
  reading: { ic: null, text: 'Leyendo audios…', short: 'Leyendo audios…', today: 'Leyendo audios…', busy: true },
};
// Dato que acompaña a la acción en C (lo que se sabe hoy, en gris).
const FACT = { subs: 'Sin subs ES', latread: 'Audio MULTI', latcheck: 'Audio ES', reading: 'Audio MULTI' };

const sizeLine = (c, extra = '') => `<span class="cat-size-line"><span class="cat-size">${c.size}</span>
  ${c.hdr ? '<span class="cat-tag cat-hdr">HDR</span>' : ''}${c.torbox ? '<span class="cat-tag cat-torbox">TorBox</span>' : ''}
  ${c.subEs ? `<span class="cat-tag lat">${ic('subs', 11)}ES</span>` : ''}${extra}</span>`;
const quality = (c, extra = '') => `<span class="cat-quality"><span class="cat-quality-q">${ic('monitor')}${stars(c.q[1])}${c.q[0]}</span>
  ${c.lat ? '<span class="cat-tag lat">LAT</span>' : ''}${extra}</span>`;
const mid = (c) => c.torbox ? '' : `<span class="cat-mid"><span class="cat-verdict ${c.health[0]}">${bars(c.health[1])}<strong>${c.health[2]}</strong></span>
  <span class="cat-people"><b>${c.seeds[0]}</b> seeds · ${c.seeds[1]} leechers</span></span>`;
const playBtns = (c, before = '') => `<span class="cat-opt-actions">${before}
  ${c.torbox ? '' : `<button id="bg-${c.vid}" class="cat-bg-btn" title="Bajar de fondo">${ic('download', 15)}</button>`}
  <button id="play-${c.vid}" class="cat-play ${c.torbox ? 'torbox' : ''}" aria-label="Ver ahora">${ic('play', 18)}</button></span>`;
const row = (c, { size = '', qual = '', after = '', before = '', cls = '' } = {}) =>
  `<span class="case">${c.label}</span><li class="cat-opt ${c.torbox ? 'tb-idle' : ''} ${cls}"><span class="cat-size-cell">${sizeLine(c, size)}${quality(c, qual)}</span>${mid(c)}${playBtns(c, before)}${after}</li>`;

const link = (c, k, text = ACT[k].text) => ACT[k].busy
  ? `<span class="act busy" role="status"><span class="spin" aria-hidden="true"></span>${text}</span>`
  : `<button id="${k}-${c.vid}" type="button" class="act" title="${ACT[k].why}">${ic(ACT[k].ic)}${text}</button>`;

const VARIANTS = [
  { key: '0', name: 'Hoy (referencia)', note: 'Acciones en caja chica y mayúscula, igual que los badges: no se distingue dato de acción.',
    render: (c) => row(c, {
      size: c.acts.filter((k) => k === 'subs').map((k) => `<button class="act-today">${ic('subs', 11)}${ACT[k].today}</button>`).join(''),
      qual: c.acts.filter((k) => k !== 'subs').map((k) => ACT[k].busy ? `<span class="act-today"><span class="spin"></span>${ACT[k].today}</span>` : `<button class="act-today">${ic('speaker', 11)}${ACT[k].today}</button>`).join(''),
    }) },
  { key: 'A', name: 'Fila secundaria', note: 'Los badges quedan solos arriba. Las acciones bajan a una franja al pie de la tarjeta, separada por un filete, como links con ícono. Solo aparece si hay algo que hacer: la fila sin acciones no crece.',
    render: (c) => row(c, { cls: c.acts.length ? 'has-acts' : '', after: c.acts.length ? `<span class="acts">${c.acts.map((k) => link(c, k)).join('')}</span>` : '' }) },
  { key: 'B', name: 'Junto al ▶', note: 'Todo lo que se toca vive a la derecha: píldoras de texto en minúscula antes del bajar y el ▶. A la izquierda queda solo lectura. Es la que más ancho come: en mobile las píldoras quedan solo ícono (el texto pasa al tooltip y al lector).',
    render: (c) => row(c, { before: !c.acts.length ? '' : '<span class="pills">' + c.acts.map((k) => ACT[k].busy
      ? `<span class="pill busy" role="status" aria-label="${ACT[k].short}"><span class="spin"></span><span class="t">${ACT[k].short}</span></span>`
      : `<button id="${k}-${c.vid}" type="button" class="pill" title="${ACT[k].why}" aria-label="${ACT[k].short}">${ic(ACT[k].ic)}<span class="t">${ACT[k].short}</span></button>`).join('') + '</span>' }) },
  { key: 'C', name: 'Dato + verbo en línea', note: 'Lo dudoso se dice como dato gris (“Audio MULTI”, “Sin subs ES”) y al lado un verbo azul que lo resuelve. Queda donde está hoy, sin caja: se lee como una frase.',
    render: (c) => row(c, {
      size: c.acts.includes('subs') ? `<span class="pair"><span class="fact">${FACT.subs}</span>${link(c, 'subs', 'buscar')}</span>` : '',
      qual: c.acts.filter((k) => k !== 'subs').map((k) => `<span class="pair"><span class="fact">${ic('speaker', 12)}${FACT[k]}</span>${link(c, k, { latread: 'revisar latino', latcheck: 'ver pistas', reading: 'leyendo…' }[k])}</span>`).join(''),
    }) },
  { key: 'D', name: 'Menú “…”', note: 'Una sola puerta junto al ▶; un punto azul avisa que hay algo para revisar. La fila queda como hoy sin las etiquetas. Lo que se pierde: la acción no se ve sin abrir el menú.',
    render: (c) => {
      const busy = c.acts.includes('reading');
      const items = c.acts.filter((k) => !ACT[k].busy).map((k) => `<button id="${k}-${c.vid}" role="menuitem">${ic(ACT[k].ic, 15)}<span>${ACT[k].short}</span><small>${ACT[k].why}</small></button>`);
      const menu = `<div class="menu" role="menu" id="menu-${c.vid}" ${c.id === 't2' && !c.vid.includes('phone') ? '' : 'hidden'}>${items.join('')}${items.length ? '<hr>' : ''}<button role="menuitem">${ic('download', 15)}<span>Copiar magnet</span></button></div>`;
      const more = `<button id="more-${c.vid}" class="more ${busy ? 'busy' : ''}" aria-haspopup="menu" aria-expanded="${c.id === 't2' && !c.vid.includes('phone')}" aria-controls="menu-${c.vid}" title="Más acciones">${busy ? '<span class="spin" aria-hidden="true"></span>' : ic('more', 16)}${items.length ? '<span class="dot"></span>' : ''}</button>`;
      return row(c, { before: more, qual: busy ? '<span class="hint">leyendo audios…</span>' : '', after: menu });
    } },
];

document.getElementById('variants').innerHTML = VARIANTS.map((v) => `<section class="variant v-${v.key.toLowerCase()}" id="variant-${v.key}">
  <h2><b>${v.key}</b>${v.name}</h2><p>${v.note}</p>
  <div class="frames">${['desktop', 'phone'].map((f) => `<div class="frame ${f}"><span class="frame-label">${f === 'phone' ? 'Mobile · 375 px' : 'Desktop · panel lateral'}</span>
  <div class="cat-group"><ul class="cat-options">${CASES.map((c) => v.render({ ...c, vid: `${v.key}-${f}-${c.id}` })).join('')}</ul></div></div>`).join('')}</div></section>`).join('');

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.more');
  document.querySelectorAll('.v-d .menu').forEach((m) => { if (!btn || m.id !== btn.getAttribute('aria-controls')) { m.hidden = true; } });
  document.querySelectorAll('.v-d .more').forEach((b) => { if (b !== btn) b.setAttribute('aria-expanded', 'false'); });
  if (btn) { const m = document.getElementById(btn.getAttribute('aria-controls')); m.hidden = !m.hidden; btn.setAttribute('aria-expanded', String(!m.hidden)); }
});
</script>
</body>
</html>
